# Ein Befehl startet alles:  cp .env.example .env && docker compose up -d --build
# Shop:     http://localhost:3000/ar      Admin: http://localhost:3000/ar/admin
# Mailpit:  http://localhost:8025         MinIO-Konsole: http://localhost:9001

name: sholat-aljanoub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sholat_aljanoub}
      TZ: Asia/Hebron
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sa} -d ${POSTGRES_DB:-sholat_aljanoub}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Community-Build von MinIO (offizielle Images werden nicht mehr veröffentlicht, siehe DECISIONS D25)
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sa_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sa_minio_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sa}:${POSTGRES_PASSWORD:-sa_dev_password}@postgres:5432/${POSTGRES_DB:-sholat_aljanoub}?schema=public
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      TZ: Asia/Hebron
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  miniodata:
