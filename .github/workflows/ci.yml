name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://sa:sa_ci_password@localhost:5432/sholat_aljanoub?schema=public
  TEST_DATABASE_URL: postgresql://sa:sa_ci_password@localhost:5432/sa_test?schema=public
  SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
  TZ: Asia/Hebron

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sa
          POSTGRES_PASSWORD: sa_ci_password
          POSTGRES_DB: sholat_aljanoub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sa" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Chromium für die PDF-Tests (packages/pdf)
      - run: npx playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm --filter @sa/web build
        env:
          NODE_ENV: production

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sa
          POSTGRES_PASSWORD: sa_ci_password
          POSTGRES_DB: sholat_aljanoub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sa" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: sa_minio
      S3_SECRET_KEY: sa_minio_secret
      S3_BUCKET: sa-files
      SEED_DEMO_DATA: "true"
      SEED_OWNER_PHONE: "+970599000001"
      SEED_OWNER_PASSWORD: ChangeMe!2026
      SEED_DEMO_PASSWORD: Demo-2026-pass
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=sa_minio -e MINIO_ROOT_PASSWORD=sa_minio_secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy && pnpm db:seed
      - run: pnpm --filter @sa/web build
      # vor dem App-Start: die App rendert PDFs mit Chromium
      - run: npx playwright install --with-deps chromium
      - name: Start app (standalone)
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          mkdir -p apps/web/.next/standalone/apps/web/public
          PORT=3000 HOSTNAME=127.0.0.1 nohup node apps/web/.next/standalone/apps/web/server.js > web.log 2>&1 &
          npx wait-on -t 60000 http://127.0.0.1:3000/api/health
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            web.log
