# Produktion: ergänzt docker-compose.yml (wird über COMPOSE_FILE in .env automatisch mitgeladen)
#   - Caddy davor: HTTPS mit automatischem Let's-Encrypt-Zertifikat für DOMAIN
#   - Datenbank, MinIO und Web nicht direkt aus dem Internet erreichbar
#   - kein Mailpit; E-Mails gehen an den echten SMTP-Server aus .env
services:
  postgres:
    ports: !reset []

  minio:
    ports: !reset []

  mailpit:
    profiles: ["dev"]

  web:
    ports: !reset []
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
    depends_on: !override
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
